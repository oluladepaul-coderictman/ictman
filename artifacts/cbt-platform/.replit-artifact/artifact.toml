kind = "web"
previewPath = "/"
title = "CBT Platform"
version = "1.0.0"
id = "artifacts/cbt-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22570
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cbt-platform run dev"

[services.env]
PORT = "22570"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cbt-platform", "run", "build"]
publicDir = "artifacts/cbt-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
